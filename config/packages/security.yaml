security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  providers:
    app_user_provider:
      entity: { class: App\Entity\User, property: email }

  role_hierarchy:
    # ROLE_USER est conservé comme socle pour les comptes historiques.
    # Les nouveaux comptes opérationnels doivent recevoir ROLE_RECEPTION_CAISSE.
    ROLE_RECEPTION_CAISSE: [ROLE_USER]
    ROLE_MANAGER: [ROLE_RECEPTION_CAISSE]
    ROLE_ADMIN:   [ROLE_MANAGER]
    ROLE_SUPER_ADMIN: [ROLE_ADMIN]

  firewalls:
    dev: { pattern: ^/(_(profiler|wdt)|css|images|js)/, security: false }
    main:
      lazy: true
      provider: app_user_provider
      user_checker: App\Security\UserChecker
      access_denied_url: /access-denied
      form_login:
        login_path: app_login
        check_path: app_login
        default_target_path: /dashboard
        username_parameter: email
        password_parameter: password
        enable_csrf: true
      # Bloque temporairement les attaques par essais successifs.
      # La limite est calculée par adresse IP et par identifiant.
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'
      logout: 
        path: app_logout
        target: app_login  # ✅ Ajout de la redirection après logout

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/lock, roles: PUBLIC_ACCESS }
    - { path: ^/user, roles: ROLE_ADMIN }
    - { path: ^/admin, roles: ROLE_ADMIN }
    - { path: ^/prestation, roles: ROLE_ADMIN }
    - { path: ^/cash/categories, roles: ROLE_ADMIN }
    - { path: ^/cash/expense/new, roles: ROLE_RECEPTION_CAISSE }
    - { path: ^/cash/close$, roles: ROLE_RECEPTION_CAISSE }
    - { path: ^/cash/(deposit|closures|closure|expenses|entries|injections), roles: ROLE_MANAGER }
    - { path: ^/stats, roles: ROLE_MANAGER }
    - { path: ^/(dashboard|agenda|client|rdv|payment|cash), roles: ROLE_RECEPTION_CAISSE }
    - { path: ^/api, roles: ROLE_RECEPTION_CAISSE }
    - { path: ^/account, roles: ROLE_USER }
    # Toutes les autres pages et API exigent au minimum un compte authentifié.
    - { path: ^/, roles: ROLE_USER }
